name: IPQ60XX-LibWrt

on:
  workflow_dispatch:
  workflow_call:

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-23.05
  REPO_COMMIT: ''
  DIY_SCRIPT: scripts/Roc-script.sh
  CLASH_KERNEL: amd64
  UPLOAD_BIN_DIR: false
  FIRMWARE_RELEASE: true
  FIRMWARE_TAG: IPQ60XX
  KERNEL_VERSION: 6.6.89
  TZ: Asia/Shanghai

jobs:
  Build:
    runs-on: ubuntu-24.04

    steps:
    - name: Check Server Performance(检查服务器性能)
      run: |
        echo "警告⚠ 分配的服务器性能有限，若选择的插件过多，务必注意CPU性能！"
        echo -e "已知CPU型号（降序）：7763，8370C，8272CL，8171M，E5-2673 \n"
        cat /proc/cpuinfo | grep -E 'physical id|model name' | head -10
        free -h
        df -hT

    - name: Initialization Environment(初始化环境)
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt update -y && sudo -E apt full-upgrade -y
        sudo -E apt install -y $(curl -fsSL ophub.org/ubuntu2404-make-openwrt-depends)
        sudo -E systemctl daemon-reload
        sudo -E timedatectl set-timezone $TZ

    - name: Checkout(检出代码)
      uses: actions/checkout@main

    - name: Clone Source Code(克隆源代码&锁定6.6.89内核)
      run: |
        sudo mkdir -p /mnt/openwrt && sudo chown -R $USER:$USER /mnt/openwrt
        git clone -b $REPO_BRANCH --single-branch $REPO_URL /mnt/openwrt
        cd /mnt/openwrt
        echo "OPENWRT_PATH=$PWD" >> $GITHUB_ENV
        VERSION_INFO=$(git show -s --date=short --format="作者: %an<br/>时间: %cd<br/>内容: %s<br/>hash: %h")
        echo "VERSION_INFO=$VERSION_INFO" >> $GITHUB_ENV

        # 自动检测并锁定6.6.89内核版本
        echo "🔍 检测并锁定6.6内核版本..."
        KERNEL_FILE=$(find target/linux/generic/ -type f -name "kernel-6.6*" | head -1)
        KERNEL_DIR=$(find target/linux/generic/ -type d -name "kernel-6.6*" | head -1)
        if [ -n "$KERNEL_DIR" ]; then
            sed -i "s/PKG_VERSION:=.*/PKG_VERSION:=6.6.89/" $KERNEL_DIR/Makefile
            sed -i "s/PKG_HASH:=.*/PKG_HASH:=skip/" $KERNEL_DIR/Makefile
        elif [ -n "$KERNEL_FILE" ]; then
            sed -i "s/^.*/6.6.89/" $KERNEL_FILE
        else
            echo "6.6.89" > target/linux/generic/kernel-6.6
        fi
        echo "✅ 已强制锁定内核版本为：${KERNEL_VERSION}"
        echo "VERSION_KERNEL=${KERNEL_VERSION}" >> $GITHUB_ENV

    - name: Define Env Variables(定义环境变量-无配置干扰)
      run: |
        cd $OPENWRT_PATH
        # 直接手动定义目标架构变量，避免读取错误配置
        echo "SOURCE_REPO=immortalwrt" >> $GITHUB_ENV
        echo "DEVICE_TARGET=qualcommax" >> $GITHUB_ENV
        echo "DEVICE_SUBTARGET=ipq60xx" >> $GITHUB_ENV
        echo "HASH=$(git log -1 --pretty=format:'%h')" >> $GITHUB_ENV
        echo "CACHE_DATE=$(date +"%Y-%m-%d %H:%M:%S")" >> $GITHUB_ENV

    - name: Cache Toolchain(缓存工具链-仅保留核心路径)
      uses: actions/cache@main
      with:
        key: ${{ env.SOURCE_REPO }}-${{ env.REPO_BRANCH }}-${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}-${{ env.HASH }}-${{ env.CACHE_DATE }}
        restore-keys: ${{ env.SOURCE_REPO }}-${{ env.REPO_BRANCH }}-${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}-
        path: |
          ${{ env.OPENWRT_PATH }}/.ccache
          ${{ env.OPENWRT_PATH }}/staging_dir/toolchain-*

    - name: Refresh Toolchain Cache(刷新工具链缓存)
      run: |
        if [ -d "$OPENWRT_PATH/staging_dir" ]; then
          find $OPENWRT_PATH/staging_dir -type d -name "stamp" -not -path "*target*" | xargs -I {} find {} -type f -exec touch {} \;
        fi

    - name: Install Feeds(更新并安装feeds)
      run: |
        cd $OPENWRT_PATH
        ./scripts/feeds update -a && ./scripts/feeds install -a

    - name: Load Custom Configuration(写入360V6完整配置-核心)
      run: |
        cd $OPENWRT_PATH
        # 直接写入qualcommax/ipq60xx（360V6）完整配置，无任何空配置干扰
        cat > .config << EOF
CONFIG_TARGET_qualcommax=y
CONFIG_TARGET_qualcommax_ipq60xx=y
CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_qihoo_360v6=y
CONFIG_ATH11K_MEM_PROFILE_512M=y
CONFIG_NSS_FIRMWARE_VERSION_11_4=y
# 需编译的9个内核模块
CONFIG_PACKAGE_kmod-fuse=y
CONFIG_PACKAGE_kmod-fs-btrfs=y
CONFIG_PACKAGE_kmod-ipt-extra=y
CONFIG_PACKAGE_kmod-ipt-nat=y
CONFIG_PACKAGE_kmod-ipt-nat6=y
CONFIG_PACKAGE_kmod-ipt-physdev=y
CONFIG_PACKAGE_kmod-nf-ipvs=y
CONFIG_PACKAGE_kmod-veth=y
CONFIG_PACKAGE_kmod-ipt-fullconenat=y
# 通用编译配置-仅保留安全优化
CONFIG_DEVEL=y
CONFIG_TARGET_OPTIONS=y
CONFIG_TARGET_OPTIMIZATION="-O3 -pipe"
CONFIG_CCACHE=y
CONFIG_PACKAGE_default-settings=y
CONFIG_PACKAGE_default-settings-chn=y
CONFIG_TARGET_PER_DEVICE_ROOTFS=y
CONFIG_LUCI_LANG_zh_Hant=y
CONFIG_TARGET_ROOTFS_INITRAMFS=n
# ZRAM优化
CONFIG_PACKAGE_zram-swap=y
CONFIG_PACKAGE_kmod-lib-lz4=y
CONFIG_KERNEL_ZRAM_BACKEND_LZ4=y
CONFIG_KERNEL_ZRAM_BACKEND_LZO=y
CONFIG_KERNEL_ZRAM_DEF_COMP_LZ4=y
EOF
        # 生成配置，确认目标架构为qualcommax/ipq60xx
        make defconfig
        echo "✅ 配置生成完成，当前目标架构："
        grep -E 'CONFIG_TARGET_(qualcommax|ipq60xx)' .config

    - name: Download Dependencies(下载依赖包)
      run: |
        cd $OPENWRT_PATH
        make download -j$(nproc)
        # 清理下载缓存中的冗余文件
        find dl -type f -name "*.hash" -delete

    - name: Cache Downloa
