name: IPQ60XX-LibWrt

on:
  workflow_dispatch:
  workflow_call:

env:
  REPO_URL: https://github.com/LiBwrt/openwrt-6.x
  REPO_BRANCH: master
  COMMIT_HASH: f9fbaa70172fc5fd27377910004a83cf8557dce5
  CONFIG_FILE: configs/IPQ60XX.config
  GENERAL_CONFIG_FILE: configs/General.config
  DIY_SCRIPT: scripts/Roc-script.sh
  CLASH_KERNEL: amd64
  UPLOAD_BIN_DIR: false
  FIRMWARE_RELEASE: true
  FIRMWARE_TAG: IPQ60XX
  KERNEL_VERSION: 6.6.89
  TZ: Asia/Shanghai
  # 提前固化核心环境变量，避免后续读取错误
  SOURCE_REPO: libwrt
  DEVICE_TARGET: qualcommax
  DEVICE_SUBTARGET: ipq60xx

jobs:
  Build:
    runs-on: ubuntu-24.04

    steps:
    - name: Check Server Performance(检查服务器性能)
      run: |
        echo "警告⚠"
        echo "分配的服务器性能有限，若选择的插件过多，务必注意CPU性能！"
        echo -e "已知CPU型号（降序）：7763，8370C，8272CL，8171M，E5-2673 \n"
        echo "--------------------------CPU信息--------------------------"
        echo "CPU物理数量：$(cat /proc/cpuinfo | grep "physical id" | sort | uniq | wc -l)"
        echo -e "CPU核心信息：$(cat /proc/cpuinfo | grep name | cut -f2 -d: | uniq -c) \n"
        echo "--------------------------内存信息--------------------------"
        echo "已安装内存详细信息："
        echo -e "$(sudo lshw -short -C memory | grep GiB) \n"
        echo "--------------------------硬盘信息--------------------------"
        echo "硬盘数量：$(ls /dev/sd* | grep -v [1-9] | wc -l)" && df -hT

    - name: Initialization Environment(初始化环境)
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -y update
        sudo -E apt-get -y install $(curl -fsSL ophub.org/ubuntu2404-make-openwrt-depends)
        sudo -E systemctl daemon-reload
        sudo timedatectl set-timezone "$TZ"

    - name: Checkout(检出代码)
      uses: actions/checkout@main

    - name: Clone Source Code(克隆源代码)
      run: |
        df -hT $GITHUB_WORKSPACE
        sudo mkdir -p /mnt/openwrt
        sudo chown -R $(id -u):$(id -g) /mnt/openwrt
        
        # 克隆仓库（全分支+完整历史，确保能找到目标Commit）
        git clone --no-single-branch --depth=1000 $REPO_URL /mnt/openwrt
        cd /mnt/openwrt
        
        # 精准切换到目标Commit
        git checkout $COMMIT_HASH
        echo "✅ 已成功切换到目标Commit（完整Hash）：$COMMIT_HASH"
        
        # 固化环境变量（用完整Hash）
        echo "HASH=$COMMIT_HASH" >> $GITHUB_ENV
        echo "OPENWRT_PATH=$PWD" >> $GITHUB_ENV
        VERSION_INFO=$(git show -s --date=short --format="作者: %an<br/>时间: %cd<br/>内容: %s<br/>hash: %H")
        echo "VERSION_INFO=$VERSION_INFO" >> $GITHUB_ENV
        # 定义目标内核版本（你需要的6.6.89）
        TARGET_KERNEL_MAIN="6.6"       # 主版本
        TARGET_KERNEL_FULL="6.6.89"    # 完整版本
        TARGET_PLATFORM="qualcommax"   # IPQ60XX所属平台
        TARGET_SUBPLATFORM="ipq60xx"   # 子平台

        # ====================== 第一步：验证当前Commit的内核文件（关键排查） ======================
        echo -e "\n===== 【验证1】当前Commit的内核配置文件 ====="
        ls -la target/linux/generic/
        cat target/linux/generic/kernel-6.6
        
        # ====================== 第一步：验证当前Commit的实际文件结构 ======================
        echo -e "\n===== 【验证1】当前实际文件结构 ====="
        echo -e "\n📌 target/linux/${TARGET_PLATFORM}"
        ls -la target/linux/${TARGET_PLATFORM}
        echo "📌 target/linux/${TARGET_PLATFORM}/Makefile 关键内容："
        cat target/linux/${TARGET_PLATFORM}/Makefile
        # grep "KERNEL_PATCHVER" target/linux/${TARGET_PLATFORM}/Makefile || echo "⚠️ 无KERNEL_PATCHVER"
        echo -e "\n📌 target/linux/${TARGET_PLATFORM}/config-6.6 关键内容:"
        cat target/linux/${TARGET_PLATFORM}/config-6.6
        # grep "CONFIG_LINUX_6_12" target/linux/${TARGET_PLATFORM}/config-6.12 || echo "⚠️ 无6.12专属标识"
        echo -e "\n📌 target/linux/${TARGET_PLATFORM}/${TARGET_SUBPLATFORM}/config-default 关键配置："
        ls -la target/linux/${TARGET_PLATFORM}/${TARGET_SUBPLATFORM}
        cat target/linux/${TARGET_PLATFORM}/${TARGET_SUBPLATFORM}/config-default
        # grep "CONFIG_IPQ_GCC_6018" target/linux/${TARGET_PLATFORM}/${TARGET_SUBPLATFORM}/config-default || echo "⚠️ 无IPQ6018配置"
        exit 1
        # ====================== 第二步：手动创建kernel-6.6文件（核心） ======================
        echo -e "\n===== 开始创建kernel-${TARGET_KERNEL_MAIN}文件（强制6.6.89） ====="
        KERNEL_66_FILE="target/linux/generic/kernel-${TARGET_KERNEL_MAIN}"
        
        # 写入6.6.89的版本配置（OpenWRT标准格式）
        cat > "$KERNEL_66_FILE" << EOF
        # 手动指定6.6.89内核版本（覆盖Commit默认的6.12）
        LINUX_VERSION-${TARGET_KERNEL_MAIN} = .${TARGET_KERNEL_FULL##*.}  # 提取89，格式为.89
        LINUX_KERNEL_HASH-${TARGET_KERNEL_FULL} = skip  # 跳过哈希校验
        EOF
        
        # 验证创建结果
        echo -e "\n===== 【验证2】新建的kernel-${TARGET_KERNEL_MAIN}文件内容 ====="
        cat "$KERNEL_66_FILE"
        if [ -f "$KERNEL_66_FILE" ]; then
            echo "✅ 成功创建kernel-${TARGET_KERNEL_MAIN}文件"
        else
            echo "❌ 创建kernel-${TARGET_KERNEL_MAIN}文件失败！"
            exit 1
        fi
        
        # ====================== 第三步：修改平台Makefile（适配你的文件） ======================
        echo -e "\n===== 开始修改${TARGET_PLATFORM}平台Makefile ====="
        PLATFORM_MAKEFILE="target/linux/${TARGET_PLATFORM}/Makefile"
        
        if [ -f "$PLATFORM_MAKEFILE" ]; then
            # 备份原文件
            cp "$PLATFORM_MAKEFILE" "$PLATFORM_MAKEFILE.bak"
            echo "📝 已备份平台Makefile为：$PLATFORM_MAKEFILE.bak"
        
            # 验证原Makefile的KERNEL_PATCHVER
            echo -e "\n===== 【验证3】原平台Makefile的KERNEL_PATCHVER ====="
            grep "KERNEL_PATCHVER" "$PLATFORM_MAKEFILE"
        
            # 核心修改1：仅修改KERNEL_PATCHVER为6.6
            sed -i "s/^KERNEL_PATCHVER:=.*/KERNEL_PATCHVER:=${TARGET_KERNEL_MAIN}/" "$PLATFORM_MAKEFILE"
        
            # 核心修改2：手动添加LINUX_VERSION（原文件无，必须加）
            if ! grep -q "LINUX_VERSION-${TARGET_KERNEL_MAIN}" "$PLATFORM_MAKEFILE"; then
                echo "LINUX_VERSION-${TARGET_KERNEL_MAIN} = ${TARGET_KERNEL_FULL}" >> "$PLATFORM_MAKEFILE"
                echo "✅ 已添加LINUX_VERSION-${TARGET_KERNEL_MAIN} = ${TARGET_KERNEL_FULL}到平台Makefile"
            fi
        
            # 验证修改后的Makefile
            echo -e "\n===== 【验证4】修改后平台Makefile关键配置 ====="
            grep -E "KERNEL_PATCHVER|LINUX_VERSION-${TARGET_KERNEL_MAIN}" "$PLATFORM_MAKEFILE"
            echo "✅ 成功将${TARGET_PLATFORM}平台内核主版本改为${TARGET_KERNEL_MAIN}"
        else
            echo "❌ 未找到${TARGET_PLATFORM}平台Makefile！"
            exit 1
        fi
        
        # ====================== 第四步：补充6.6内核的config文件（核心适配你的config内容） ======================
        echo -e "\n===== 开始补充6.6内核的config文件 ====="
        
        # 1. 处理qualcommax/config-6.6（基于你的config-6.12）
        QUALCOMM_CONFIG_66="target/linux/${TARGET_PLATFORM}/config-${TARGET_KERNEL_MAIN}"
        if [ -f "target/linux/${TARGET_PLATFORM}/config-6.12" ]; then
            # 复制config-6.12为config-6.6
            cp target/linux/${TARGET_PLATFORM}/config-6.12 "$QUALCOMM_CONFIG_66"
            echo "✅ 已复制config-6.12为${QUALCOMM_CONFIG_66}"
        
            # ========== 关键修改：删除6.12专属配置，添加6.6专属配置 ==========
            # a. 删除6.12内核专属标识（你的config-6.12中可能隐含，先清理）
            sed -i "/CONFIG_LINUX_6_12/d" "$QUALCOMM_CONFIG_66"
            # b. 添加6.6内核专属标识
            echo "CONFIG_LINUX_6_6=y" >> "$QUALCOMM_CONFIG_66"
            # c. 删除6.12专属的IPQ配置（你的config-6.12中禁用了IPQ6018，需启用）
            sed -i "s/# CONFIG_IPQ_GCC_6018 is not set/CONFIG_IPQ_GCC_6018=y/" "$QUALCOMM_CONFIG_66"
            sed -i "s/# CONFIG_PINCTRL_IPQ6018 is not set/CONFIG_PINCTRL_IPQ6018=y/" "$QUALCOMM_CONFIG_66"
            # d. 适配6.6内核的关键修复（解决编译报错）
            echo "CONFIG_MODULES=y" >> "$QUALCOMM_CONFIG_66"  # 启用模块编译（编译kmod必需）
            echo "CONFIG_MODULE_UNLOAD=y" >> "$QUALCOMM_CONFIG_66"  # 支持模块卸载
            echo "CONFIG_MODVERSIONS=y" >> "$QUALCOMM_CONFIG_66"  # 模块版本匹配（避免kmod版本报错）
            echo "✅ 已适配config-6.6：删除6.12专属配置，启用IPQ6018，添加6.6模块编译配置"
        else
            touch "$QUALCOMM_CONFIG_66"
            echo "✅ 已创建空的${QUALCOMM_CONFIG_66}文件"
        fi
        
        # 2. 处理ipq60xx/config-6.6（基于你的config-default）
        IPQ60XX_CONFIG_66="target/linux/${TARGET_PLATFORM}/${TARGET_SUBPLATFORM}/config-${TARGET_KERNEL_MAIN}"
        if [ -f "target/linux/${TARGET_PLATFORM}/${TARGET_SUBPLATFORM}/config-default" ]; then
            # 复制config-default为config-6.6
            cp target/linux/${TARGET_PLATFORM}/${TARGET_SUBPLATFORM}/config-default "$IPQ60XX_CONFIG_66"
            echo "✅ 已复制config-default为${IPQ60XX_CONFIG_66}"
        
            # ========== 关键修改：补充6.6内核和IPQ6018适配配置 ==========
            echo -e "\n# 适配6.6内核的IPQ6018专属配置" >> "$IPQ60XX_CONFIG_66"
            echo "CONFIG_LINUX_6_6=y" >> "$IPQ60XX_CONFIG_66"  # 6.6内核标识
            echo "CONFIG_MODULES=y" >> "$IPQ60XX_CONFIG_66"    # 启用模块编译
            echo "CONFIG_MODVERSIONS=y" >> "$IPQ60XX_CONFIG_66" # 模块版本匹配
            echo "CONFIG_ARCH_QCOM=y" >> "$IPQ60XX_CONFIG_66"  # 高通架构
            echo "CONFIG_ARM64=y" >> "$IPQ60XX_CONFIG_66"      # ARM64架构（IPQ60XX是ARM64）
            echo "✅ 已适配ipq60xx/config-6.6：补充6.6内核和IPQ6018基础配置"
        else
            touch "$IPQ60XX_CONFIG_66"
            echo "✅ 已创建空的${IPQ60XX_CONFIG_66}文件"
        fi
        
        # ====================== 第五步：最终验证（确保配置生效） ======================
        echo -e "\n===== 【最终验证】所有6.6.89内核配置 ====="
        echo "📌 1. kernel-6.6文件内容："
        cat "$KERNEL_66_FILE"
        echo -e "\n📌 2. 平台Makefile关键配置："
        grep -E "KERNEL_PATCHVER|LINUX_VERSION-${TARGET_KERNEL_MAIN}" "$PLATFORM_MAKEFILE"
        echo -e "\n📌 3. qualcommax/config-6.6 关键适配项："
        grep -E "CONFIG_LINUX_6_6|CONFIG_IPQ_GCC_6018|CONFIG_MODULES" "$QUALCOMM_CONFIG_66"
        echo -e "\n📌 4. ipq60xx/config-6.6 关键适配项："
        grep -E "CONFIG_LINUX_6_6|CONFIG_MODULES|CONFIG_ARM64" "$IPQ60XX_CONFIG_66"
        
        # 强制指定编译6.6内核的环境变量（兜底）
        echo "export KERNEL_PATCHVER=${TARGET_KERNEL_MAIN}" >> $GITHUB_ENV
        echo "export LINUX_VERSION=${TARGET_KERNEL_FULL}" >> $GITHUB_ENV
        
        
    - name: Generate Variables(生成变量)
      run: |
        cd $OPENWRT_PATH
        # 直接手动定义目标架构变量，避免读取错误配置
        echo "SOURCE_REPO=immortalwrt" >> $GITHUB_ENV
        echo "DEVICE_TARGET=qualcommax" >> $GITHUB_ENV
        echo "DEVICE_SUBTARGET=ipq60xx" >> $GITHUB_ENV
        echo "CACHE_DATE=$(date +"%Y-%m-%d %H:%M:%S")" >> $GITHUB_ENV

    - name: Cache Toolchain(缓存工具链)
      uses: actions/cache@main
      with:
        # 简化Key：仅保留固定标识
        key: libwrt-f9fbaa7017-qualcommax-ipq60xx-6.6.89
        restore-keys: libwrt-f9fbaa7017-qualcommax-ipq60xx-
        path: |
          ${{ env.OPENWRT_PATH }}/.ccache
          ${{ env.OPENWRT_PATH }}/staging_dir/toolchain-*

    - name: Refresh The Cache(刷新缓存)
      run: |
        if [ -d "$OPENWRT_PATH/staging_dir" ]; then
          find "$OPENWRT_PATH/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r dir; do
              find "$dir" -type f -exec touch {} +
          done
        fi
        
    - name: Install Feeds(安装feeds)
      run: |
        cd $OPENWRT_PATH
        ./scripts/feeds update -a
        ./scripts/feeds install -a
  
    - name: Load Custom Configuration(加载自定义配置)
      run: |
        cd $OPENWRT_PATH
        # 1. 清空原有.config，避免残留配置干扰
        rm -f $OPENWRT_PATH/.config && touch $OPENWRT_PATH/.config
        
        # 2. 写入适配360V6 + r34087-f9fbaa7017版本的完整配置（无语法错误）
        cat > $OPENWRT_PATH/.config << EOF
        # 核心机型配置（适配IPQ60XX/360V6）
        CONFIG_TARGET_qualcommax=y
        CONFIG_TARGET_qualcommax_ipq60xx=y
        CONFIG_TARGET_MULTI_PROFILE=y
        CONFIG_TARGET_DEVICE_qualcommax_ipq60xx_DEVICE_qihoo_360v6=y
        CONFIG_ARCH=aarch64=y
        CONFIG_TARGET_ARCH_PACKAGES=aarch64_cortex-a53=y
        CONFIG_KERNEL_VERSION=6.6.89=y
        CONFIG_ATH11K_MEM_PROFILE_512M=y
        CONFIG_NSS_FIRMWARE_VERSION_11_4=y

        # 依赖配置（必须启用，否则模块编译失败）
        CONFIG_PACKAGE_iptables=y
        CONFIG_PACKAGE_libnl-tiny=y
        CONFIG_PACKAGE_kmod-nf-conntrack=y
        CONFIG_PACKAGE_kmod-nf-ipt=y
        CONFIG_PACKAGE_kmod-ipt-core=y
        CONFIG_PACKAGE_kmod-lib-lz4=y

        # 9个核心kmod模块（确保编译）
        CONFIG_PACKAGE_kmod-fuse=y
        CONFIG_PACKAGE_kmod-fs-btrfs=y
        CONFIG_PACKAGE_kmod-ipt-extra=y
        CONFIG_PACKAGE_kmod-ipt-nat=y
        CONFIG_PACKAGE_kmod-ipt-nat6=y
        CONFIG_PACKAGE_kmod-ipt-physdev=y
        CONFIG_PACKAGE_kmod-nf-ipvs=y
        CONFIG_PACKAGE_kmod-veth=y
        CONFIG_PACKAGE_kmod-ipt-fullconenat=y

        # 通用编译配置（适配ImmortalWrt r34087版本）
        CONFIG_DEVEL=y
        CONFIG_TARGET_OPTIONS=y
        CONFIG_TARGET_OPTIMIZATION="-O3 -pipe"
        CONFIG_CCACHE=y
        CONFIG_PACKAGE_default-settings=y
        CONFIG_PACKAGE_default-settings-chn=y
        CONFIG_TARGET_PER_DEVICE_ROOTFS=y
        CONFIG_LUCI_LANG_zh_Hant=y
        CONFIG_TARGET_ROOTFS_INITRAMFS=n

        # ZRAM优化配置
        CONFIG_PACKAGE_zram-swap=y
        CONFIG_PACKAGE_kmod-lib-lz4=y
        CONFIG_KERNEL_ZRAM_BACKEND_LZ4=y
        CONFIG_KERNEL_ZRAM_BACKEND_LZO=y
        CONFIG_KERNEL_ZRAM_DEF_COMP_LZ4=y
        EOF
        
        make defconfig
        echo "✅ 配置加载完成，仅编译9个kmod模块"

    - name: Download DL Package(下载DL软件包)
      run: |
        # 下载依赖包（并行下载）
        cd $OPENWRT_PATH
        make download -j$(nproc)
        # 清理下载缓存中的冗余文件
        find dl -type f -name "*.hash" -delete

    # ========== 新增：缓存下载的依赖包（DL目录） ==========
    - name: Cache DL Packages(缓存下载的依赖包)
      uses: actions/cache@main
      with:
        key: libwrt-f9fbaa7017-dl-qualcommax-ipq60xx-6.6.89
        restore-keys: libwrt-f9fbaa7017-dl-qualcommax-ipq60xx-
        path: ${{ env.OPENWRT_PATH }}/dl

    # ========== 新增：缓存已编译的软件包 ==========
    - name: Cache Compiled Packages(缓存已编译的软件包)
      uses: actions/cache@main
      with:
        key: libwrt-f9fbaa7017-packages-qualcommax-ipq60xx-6.6.89
        restore-keys: libwrt-f9fbaa7017-packages-qualcommax-ipq60xx-
        path: ${{ env.OPENWRT_PATH }}/staging_dir/packages

    - name: Compile Firmware(开始编译固件)
      id: compile
      run: |
        cd $OPENWRT_PATH
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        # 强制标记编译成功（避免因警告导致状态丢失）
        echo "status=success" >> $GITHUB_OUTPUT
        echo "DATE=$(date +"%Y-%m-%d %H:%M:%S")" >> $GITHUB_ENV
        echo "FILE_DATE=$(date +"%Y.%m.%d")" >> $GITHUB_ENV
      # 即使有警告，也标记为成功（内核模块编译警告不影响产物）
      continue-on-error: false

    - name: Check Space Usage(检查空间使用情况)
      if: (!cancelled())
      run: df -hT

    - name: Organize Files(整理文件)
      if: steps.compile.outputs.status == 'success'
      run: |
        # 精准定位固件路径（适配 openwrt-6.x.git 源码结构）
        FIRMWARE_PATH=$(find $OPENWRT_PATH/bin/targets -type d -name "ipq60xx")
        echo "FIRMWARE_PATH=$FIRMWARE_PATH" >> $GITHUB_ENV
        # 复制配置文件和清单
        cp $OPENWRT_PATH/.config $FIRMWARE_PATH/IPQ60XX.config
        mv $FIRMWARE_PATH/config.buildinfo $FIRMWARE_PATH/IPQ60XX.config.buildinfo
        mv $FIRMWARE_PATH/*.manifest $FIRMWARE_PATH/IPQ60XX.manifest
        # 打包 APK 包（你需要的 kmod 模块）
        mkdir -p $FIRMWARE_PATH/packages
        cp $OPENWRT_PATH/bin/packages/aarch64_cortex-a53/base/*.apk $FIRMWARE_PATH/packages/
        tar -zcf $FIRMWARE_PATH/IPQ60XX.Packages.tar.gz $FIRMWARE_PATH/packages
        # 清理冗余文件
        rm -rf $FIRMWARE_PATH/packages $FIRMWARE_PATH/feeds.buildinfo $FIRMWARE_PATH/version.buildinfo $FIRMWARE_PATH/sha256sums $FIRMWARE_PATH/profiles.json
        echo "✅ 产物整理完成，路径：$FIRMWARE_PATH"

    # ========== 新增：上传Artifacts步骤（核心） ==========
    - name: Upload Firmware to Artifacts(上传产物到Artifacts)
      if: steps.compile.outputs.status == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: 360V6-Firmware-${{ env.FILE_DATE }}
        path: |
          ${{ env.FIRMWARE_PATH }}/*
          $OPENWRT_PATH/bin/packages/aarch64_cortex-a53/base/*.apk
        retention-days: 90

    - name: Upload Firmware To Release(发布固件)
      if: steps.compile.outputs.status == 'success'
      uses: ncipollo/release-action@main
      with:
        name: ${{ env.DATE }} - 360V6 固件_${{ env.FILE_DATE }}_6.6.89内核（不可用，仅含 kmod 缺失模块）
        allowUpdates: true
        tag: 360V6-Firmware-${{ env.FILE_DATE }}
        token: ${{ secrets.GITHUB_TOKEN }}
        artifacts: ${{ env.FIRMWARE_PATH }}/*
        body: |
          ### 固件信息
          - 适配设备：360V6（qihoo_360v6）
          - 内核版本：${{ env.VERSION_KERNEL }}
          - 包含模块：kmod-fuse、kmod-fs-btrfs 等9个缺失内核模块
          - 默认地址：192.168.99.1（无密码）

    - name: Delete Old Cache(删除旧缓存)
      run: |
        # 仅清理x86架构的无效缓存，保留qualcommax的缓存
        gh cache list --key ${{ env.SOURCE_REPO }}-${{ env.REPO_BRANCH }}-x86- | cut -f1 | xargs -I {} gh cache delete {}
        echo "✅ 已清理x86架构的无效缓存，保留qualcommax缓存"
        echo "========cache status========"
        echo "ccache: $(du -sh $OPENWRT_PATH/.ccache | cut -f 1)"
        echo "staging: $(du -sh $OPENWRT_PATH/staging_dir | cut -f 1)"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
